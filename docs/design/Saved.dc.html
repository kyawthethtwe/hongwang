<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Saved rooms</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF}
a{color:#0F6B63}a:hover{color:#0A4F49}
</style>
</helmet>
<div style="min-height: 100vh; background: #FFFFFF; color: #142020; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.5">
<header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 40px; border-bottom: 1px solid #E3E5E1">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 28px">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #142020">
<span style="width: 34px; height: 34px; border-radius: 9px; background: {{accent}}; display: inline-flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16"></path><path d="M3 21h18"></path><path d="M14 12h.01"></path></svg>
</span>
<span style="font-family: 'Bricolage Grotesque', Inter, sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.02em">Hongwang</span>
</a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 4px">
<a href="Main.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 10px; color: #3E4A48; text-decoration: none; font-weight: 500">Explore</a>
<a href="Trips.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 10px; color: #3E4A48; text-decoration: none; font-weight: 500">Trips</a>
<a href="Saved.dc.html" aria-current="page" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 10px; background: #EEF1EE; color: #142020; text-decoration: none; font-weight: 600">Saved</a>
<a href="Inbox.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 10px; color: #3E4A48; text-decoration: none; font-weight: 500">Inbox</a>
</nav>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<a href="Host.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 999px; color: #142020; text-decoration: none; font-weight: 500">Switch to hosting</a>
<a href="Account.dc.html" aria-label="Account settings for Daniel" style="width: 44px; height: 44px; border-radius: 999px; background: #E6E9F2; color: #1E2C55; text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; justify-content: center">DM</a>
</div>
</header>

<main style="max-width: 1200px; margin: 0 auto; padding: 32px 40px 56px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
<div>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', Inter, sans-serif; font-weight: 700; font-size: 34px; letter-spacing: -0.02em; line-height: 1.2">Saved</h1>
<p style="margin: 4px 0 0; color: #5A6664">{{countText}} · Prices shown for Dec 12 – 15</p>
</div>

<sc-if value="{{hasItems}}" hint-placeholder-val="{{true}}">
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 28px 20px">
<sc-for list="{{items}}" as="r" hint-placeholder-count="3">
<article style="position: relative">
<a href="Listing.dc.html" style="display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: #142020">
<div aria-hidden="true" style="aspect-ratio: 3 / 2; border-radius: 14px; background: {{r.tint}}"></div>
<h2 style="margin: 4px 0 0; font-size: 16px; font-weight: 600; line-height: 1.35">{{r.title}}</h2>
<p style="margin: 0; color: #5A6664; font-size: 14px">{{r.area}} · ★ {{r.rating}}</p>
<p style="margin: 0"><strong style="font-weight: 600">฿{{r.price}}</strong> night</p>
<p style="margin: 0; color: {{r.availColor}}; font-size: 14px; font-weight: 500">{{r.avail}}</p>
</a>
<button type="button" aria-label="{{r.removeLabel}}" onClick="{{r.remove}}" style="position: absolute; right: 10px; top: 10px; width: 44px; height: 44px; border-radius: 999px; border: 0; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="#C8324B" stroke="#C8324B" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7-4.4-9-9a4.8 4.8 0 0 1 9-3 4.8 4.8 0 0 1 9 3c-2 4.6-9 9-9 9z"></path></svg>
</button>
</article>
</sc-for>
</div>
</sc-if>

<sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
<div style="padding: 48px 24px; border: 1px dashed #C9CFCA; border-radius: 18px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px">
<svg aria-hidden="true" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#5A6664" stroke-width="1.8" stroke-linejoin="round"><path d="M12 20s-7-4.4-9-9a4.8 4.8 0 0 1 9-3 4.8 4.8 0 0 1 9 3c-2 4.6-9 9-9 9z"></path></svg>
<h2 style="margin: 0; font-size: 20px; font-weight: 600">Nothing saved yet</h2>
<p style="margin: 0; color: #5A6664; max-width: 40ch">Tap the heart on any room to keep it here. We'll tell you if the price drops.</p>
<a href="Main.dc.html" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; margin-top: 6px; border-radius: 12px; background: {{accent}}; color: #FFFFFF; text-decoration: none; font-weight: 600">Explore rooms</a>
<button type="button" onClick="{{restore}}" style="min-height: 44px; border: 0; background: transparent; color: #0F6B63; font: inherit; font-weight: 500; text-decoration: underline; cursor: pointer">Undo (demo)</button>
</div>
</sc-if>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0F6B63","options":["#0F6B63","#1F4FD1","#B4472A","#2E2A26"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const accent = this.props.accent ?? '#0F6B63';
    const removed = st.removed || {};
    const data = [
      { id: 'garden', title: 'Garden room in a teak house', area: 'Pradiphat', rating: '4.96', price: '1,900', tint: '#E3E8D8', avail: 'Available for your dates', ok: true },
      { id: 'loft', title: 'Loft above a coffee shop', area: 'Saphan Khwai', rating: '4.78', price: '990', tint: '#DDE3EC', avail: 'Price dropped ฿120 since you saved it', ok: true },
      { id: 'suite', title: 'Corner suite with city view', area: 'Sanam Pao', rating: '4.88', price: '2,350', tint: '#DCE4E8', avail: 'Booked for Dec 12 – 15', ok: false }
    ];
    const items = data.filter((r) => !removed[r.id]).map((r) => Object.assign({}, r, {
      availColor: r.ok ? '#0A4F49' : '#5A6664',
      removeLabel: 'Remove ' + r.title + ' from saved',
      remove: () => this.setState({ removed: Object.assign({}, removed, { [r.id]: true }) })
    }));
    return {
      accent,
      items,
      hasItems: items.length > 0,
      empty: items.length === 0,
      countText: items.length === 1 ? '1 room' : items.length + ' rooms',
      restore: () => this.setState({ removed: {} })
    };
  }
}
</script>
</body>
</html>
