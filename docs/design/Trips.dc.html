<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Your trips</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF}
a{color:#0F6B63}a:hover{color:#0A4F49}
</style>
</helmet>
<div style="min-height: 100vh; background: #FFFFFF; color: #142020; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.5">
<header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 40px; border-bottom: 1px solid #E3E5E1">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 28px">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #142020">
<span style="width: 34px; height: 34px; border-radius: 9px; background: {{accent}}; display: inline-flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16"></path><path d="M3 21h18"></path><path d="M14 12h.01"></path></svg>
</span>
<span style="font-family: 'Bricolage Grotesque', Inter, sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.02em">Hongwang</span>
</a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 4px">
<a href="Main.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 10px; color: #3E4A48; text-decoration: none; font-weight: 500">Explore</a>
<a href="Trips.dc.html" aria-current="page" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 10px; background: #EEF1EE; color: #142020; text-decoration: none; font-weight: 600">Trips</a>
<a href="Saved.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 10px; color: #3E4A48; text-decoration: none; font-weight: 500">Saved</a>
<a href="Inbox.dc.html" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 10px; color: #3E4A48; text-decoration: none; font-weight: 500">Inbox <span style="min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: {{accent}}; color: #FFFFFF; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center">1</span></a>
</nav>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<a href="Host.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 999px; color: #142020; text-decoration: none; font-weight: 500">Switch to hosting</a>
<a href="Account.dc.html" aria-label="Account settings for Daniel" style="width: 44px; height: 44px; border-radius: 999px; background: #E6E9F2; color: #1E2C55; text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; justify-content: center">DM</a>
</div>
</header>

<main style="max-width: 1040px; margin: 0 auto; padding: 32px 40px 56px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', Inter, sans-serif; font-weight: 700; font-size: 34px; letter-spacing: -0.02em; line-height: 1.2">Trips</h1>
<div style="display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid #E3E5E1">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button type="button" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="min-height: 48px; padding: 0 16px; border: 0; border-bottom: 3px solid {{t.line}}; margin-bottom: -1px; background: transparent; color: {{t.color}}; font: inherit; font-weight: 600; cursor: pointer">{{t.label}} <span style="color: #5A6664; font-weight: 500">{{t.count}}</span></button>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 16px">
<sc-for list="{{trips}}" as="t" hint-placeholder-count="2">
<article style="display: flex; flex-wrap: wrap; gap: 20px; align-items: center; padding: 16px; border: 1px solid #E3E5E1; border-radius: 18px">
<div aria-hidden="true" style="width: 168px; height: 124px; flex: none; border-radius: 12px; background: {{t.tint}}"></div>
<div style="flex: 999 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<span style="align-self: flex-start; padding: 3px 10px; border-radius: 999px; background: {{t.badgeBg}}; color: {{t.badgeFg}}; font-size: 13px; font-weight: 600">{{t.status}}</span>
<h2 style="margin: 0; font-size: 18px; font-weight: 600; line-height: 1.3">{{t.title}}</h2>
<p style="margin: 0; color: #3E4A48">{{t.dates}} · {{t.area}}</p>
<p style="margin: 0; color: #5A6664; font-size: 14px">{{t.note}}</p>
</div>
<div style="flex: 1 1 180px; display: flex; flex-direction: column; gap: 8px">
<a href="{{t.primaryHref}}" style="display: flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 16px; border-radius: 10px; background: {{t.primaryBg}}; color: {{t.primaryFg}}; border: 1px solid {{t.primaryBorder}}; text-decoration: none; font-weight: 600">{{t.primary}}</a>
<sc-if value="{{t.hasSecondary}}" hint-placeholder-val="{{true}}">
<a href="{{t.secondaryHref}}" style="display: flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 16px; border-radius: 10px; background: #FFFFFF; color: #142020; border: 1px solid #C9CFCA; text-decoration: none; font-weight: 600">{{t.secondary}}</a>
</sc-if>
</div>
</article>
</sc-for>
</div>
<p style="margin: 0; color: #5A6664; font-size: 14px">Can't find a booking? It may be under a different email. <a href="Account.dc.html">Check your account</a>.</p>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0F6B63","options":["#0F6B63","#1F4FD1","#B4472A","#2E2A26"]},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const accent = this.props.accent ?? '#0F6B63';
    const tab = st.tab || 'upcoming';
    const badge = {
      confirmed: ['#E3EFEC', '#0A4F49'],
      requested: ['#EEF1EE', '#142020'],
      completed: ['#EEF1EE', '#3E4A48'],
      cancelled: ['#FBE9E7', '#5C1A12'],
      declined: ['#EEF1EE', '#3E4A48']
    };
    const solid = { primaryBg: accent, primaryFg: '#FFFFFF', primaryBorder: accent };
    const quiet = { primaryBg: '#FFFFFF', primaryFg: '#142020', primaryBorder: '#C9CFCA' };
    const all = {
      upcoming: [
        Object.assign({ kind: 'confirmed', status: 'Confirmed', title: 'Sunny studio near BTS Ari', area: 'Ari, Bangkok', dates: 'Sat, Dec 12 – Tue, Dec 15', note: 'Check-in in 2 days, from 14:00. Your keycard code arrives on Saturday morning.', tint: '#DCE7E3', primary: 'View trip', primaryHref: 'TripDetail.dc.html', hasSecondary: true, secondary: 'Message Ploy', secondaryHref: 'Inbox.dc.html' }, solid),
        Object.assign({ kind: 'requested', status: 'Request sent', title: 'Garden room in a teak house', area: 'Pradiphat, Bangkok', dates: 'Fri, Jan 8 – Mon, Jan 11, 2027', note: 'Pim has 18 hours to respond. You have not been charged.', tint: '#E3E8D8', primary: 'View request', primaryHref: 'TripDetail.dc.html', hasSecondary: true, secondary: 'Message Pim', secondaryHref: 'Inbox.dc.html' }, quiet)
      ],
      past: [
        Object.assign({ kind: 'completed', status: 'Completed', title: 'Riverside room in Talat Noi', area: 'Talat Noi, Bangkok', dates: 'Sat, Nov 28 – Tue, Dec 1', note: 'Leave a review by Dec 15. Somchai sees it only after reviewing you too.', tint: '#DDE3EC', primary: 'Write a review', primaryHref: 'Review.dc.html', hasSecondary: true, secondary: 'View receipt', secondaryHref: 'TripDetail.dc.html' }, solid),
        Object.assign({ kind: 'completed', status: 'Completed', title: 'Loft above a coffee shop', area: 'Saphan Khwai, Bangkok', dates: 'Fri, Sep 4 – Mon, Sep 7', note: 'You rated it 5 stars.', tint: '#E8E2D6', primary: 'Book again', primaryHref: 'Listing.dc.html', hasSecondary: false, secondary: '', secondaryHref: '#' }, quiet)
      ],
      cancelled: [
        Object.assign({ kind: 'cancelled', status: 'Cancelled by you', title: 'Corner suite with city view', area: 'Sanam Pao, Bangkok', dates: 'Fri, Nov 20 – Sun, Nov 22', note: 'Cancelled on Nov 2, more than 5 days ahead. Refunded ฿5,500 to Visa •••• 4242.', tint: '#DCE4E8', primary: 'View details', primaryHref: 'TripDetail.dc.html', hasSecondary: false, secondary: '', secondaryHref: '#' }, quiet),
        Object.assign({ kind: 'declined', status: 'Declined by host', title: 'Quiet 1-bed with balcony', area: 'Ari, Bangkok', dates: 'Fri, Oct 9 – Sun, Oct 11', note: 'Ploy could not host these dates. You were not charged.', tint: '#E8E2D6', primary: 'Find similar rooms', primaryHref: 'Main.dc.html', hasSecondary: false, secondary: '', secondaryHref: '#' }, quiet)
      ]
    };
    const trips = all[tab].map((t) => Object.assign({}, t, { badgeBg: badge[t.kind][0], badgeFg: badge[t.kind][1] }));
    const tabs = [['upcoming', 'Upcoming'], ['past', 'Past'], ['cancelled', 'Cancelled']].map(([id, label]) => ({
      label,
      count: String(all[id].length),
      pressed: tab === id ? 'true' : 'false',
      line: tab === id ? '#142020' : 'transparent',
      color: tab === id ? '#142020' : '#5A6664',
      pick: () => this.setState({ tab: id })
    }));
    return { accent, tabs, trips };
  }
}
</script>
</body>
</html>
