# Local infrastructure for development. `pnpm infra:up`
# No object storage: in development the API keeps uploads on local disk (STORAGE_DRIVER=local);
# staging and production use S3 (Cloudflare R2).
services:
  postgres:
    image: postgis/postgis:17-3.5
    # postgis/postgis is published for amd64 only; on Apple Silicon Docker runs it under emulation.
    platform: linux/amd64
    environment:
      POSTGRES_USER: hongwang
      POSTGRES_PASSWORD: hongwang
      POSTGRES_DB: hongwang
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI

volumes:
  pgdata:
